name: Docker image

# Builds the image natively on amd64 and arm64 and checks it the way
# docker-compose.yml runs it. Nothing is pushed anywhere (release.yml publishes),
# and the bot never reaches Telegram (no network, fake config).
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out and builds locally.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test the image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # GitHub's native arm64 runner (free for public repositories).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: candygoogy-bot:ci
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by its multi-arch index digest; to refresh:
      # docker buildx imagetools inspect hadolint/hadolint:<version>
      - name: hadolint
        if: matrix.platform == 'linux/amd64'
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

      - name: Build
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' candygoogy/__init__.py)
          docker build \
            --build-arg CANDYGOOGY_COMMIT="$GITHUB_SHA" \
            --build-arg VERSION="$version" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .
          docker image ls "$IMAGE"

      # The same checks release.yml runs before it pushes anything.
      - name: Smoke tests
        run: .github/scripts/smoke-image.sh "$IMAGE"

      # A checkout made with umask 077 has files only their owner can read.
      # The image must still be readable by the bot's user (UID 10001).
      - name: Build from a private copy (chmod -R go-rwx)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/private-copy"
          mkdir "$copy"
          git archive --format=tar HEAD | tar -x -C "$copy"
          chmod -R go-rwx "$copy"
          docker build --build-arg CANDYGOOGY_COMMIT="$GITHUB_SHA" -t "$IMAGE-private" "$copy"
          # The same fake config as smoke-image.sh: documentation MAC and IP.
          cat > "$RUNNER_TEMP/fake.env" <<'EOF'
          BOT_TOKEN=123456:TEST-TOKEN-not-a-real-token-0000
          AUTHORIZED_USER_IDS=1111
          WORKSTATION_MAC=00:00:5e:00:53:01
          WORKSTATION_IP=192.0.2.10
          SSH_USER=botuser
          SSH_KEY_PATH=/nonexistent/id_ed25519
          EOF
          out=$(docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true --env-file "$RUNNER_TEMP/fake.env" \
                "$IMAGE-private" python bot.py --check-config)
          [ "$out" = "OK: the configuration is valid." ] || { echo "::error::check-config said: $out"; exit 1; }
          docker run --rm --network none "$IMAGE-private" sh -c 'test ! -w /app && stat -c "%U %a" /app/bot.py'

      - name: Compose files are valid
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          DOCKER_GID=999 docker compose -f docker-compose.yml -f docker-compose.docker-proxy.yml config -q
          # The published image by default; a local build never takes its name.
          [ "$(docker compose -f docker-compose.yml config --images)" = ghcr.io/candygoogy/candygoogy-bot:1 ]
          [ "$(docker compose -f docker-compose.yml -f docker-compose.build.yml config --images)" = candygoogy-bot:local ]
