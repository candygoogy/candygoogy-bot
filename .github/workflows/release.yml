name: Release image

# Publishes ghcr.io/candygoogy/candygoogy-bot for linux/amd64 and linux/arm64
# when a version tag (v1.2.3) is pushed. Each platform is built natively,
# smoke-tested, and only then pushed; the multi-arch index gets a signed build
# provenance attestation (gh attestation verify, see the README).
#
# Run it by hand ("Run workflow") for a dry run: everything except push and
# attest, so a release can be tried before the tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the jobs that push get more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/candygoogy/candygoogy-bot

jobs:
  gate:
    name: Version, tag and changelog agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' candygoogy/__init__.py)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "candygoogy/__init__.py: __version__ is missing or not SemVer: '$version'"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = push ] && [ "$REF_NAME" != "v$version" ]; then
            fail "tag $REF_NAME doesn't match __version__ $version (expected v$version)"
          fi

          heading=$(grep -m1 -F "## [$version] - " CHANGELOG.md || true)
          [ -n "$heading" ] || fail "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' heading"
          date=${heading#"## [$version] - "}
          if [[ $date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [ "$(date -u -d "$date" +%F 2>/dev/null)" = "$date" ]; then
            echo "Releasing $version, dated $date."
          elif [ "$EVENT" = push ]; then
            fail "CHANGELOG.md: '$heading' needs the release date (YYYY-MM-DD), not '$date'"
          else
            echo "::warning::Dry run: CHANGELOG.md says '$heading'; a tag needs the release date there."
          fi

  build:
    name: Build and smoke-test (${{ matrix.platform }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push by digest, on tag runs only
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # GitHub's native arm64 runner (free for public repositories).
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commit's time: BUILD_DATE, and SOURCE_DATE_EPOCH so the push below
      # rebuilds (from cache) exactly the image the smoke tests checked.
      - name: Build time
        id: time
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BuildKit pinned by its multi-arch index digest; to refresh:
      # docker buildx imagetools inspect moby/buildkit:<version>
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Build (loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.time.outputs.epoch }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CANDYGOOGY_COMMIT=${{ github.sha }}
            VERSION=${{ needs.gate.outputs.version }}
            BUILD_DATE=${{ steps.time.outputs.created }}
          provenance: false
          sbom: false
          load: true
          tags: candygoogy-bot:smoke

      - name: Smoke tests (before anything is pushed)
        run: .github/scripts/smoke-image.sh candygoogy-bot:smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.time.outputs.epoch }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CANDYGOOGY_COMMIT=${{ github.sha }}
            VERSION=${{ needs.gate.outputs.version }}
            BUILD_DATE=${{ steps.time.outputs.created }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $DIGEST"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch image
    if: github.event_name == 'push'
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # the multi-arch index and its tags
      id-token: write # Sigstore signing of the attestation
      attestations: write # storing the attestation
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2, 1 and latest; a pre-release (v1.3.0-rc.1) gets only its own
      # version, never latest.
      - name: Tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Read the index digest
        id: index
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad index digest: $digest"; exit 1; }
          platforms=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" \
            | jq -r '[.manifests[].platform | .os + "/" + .architecture] | sort | join(",")')
          [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "::error::platforms: $platforms"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          {
            echo "### Published $IMAGE:$VERSION"
            echo
            echo "Digest: \`$DIGEST\` (linux/amd64, linux/arm64)"
            echo
            echo "Tags: $(jq -r '.tags | join(", ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --owner candygoogy\`"
          } >> "$GITHUB_STEP_SUMMARY"
